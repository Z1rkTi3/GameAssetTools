name: Python tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install checkout
        run: python -m pip install -e .
      - name: Pure Python tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Compile Python sources
        run: python -m compileall -q game_asset_tools game_assets blender_addon scripts tests
      - name: Check CLI imports and registry
        run: |
          python -m game_asset_tools --version
          python -m game_asset_tools list
      - name: Build add-on archive without Blender
        run: python scripts/package_addon.py
